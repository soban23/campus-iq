services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./chroma_db:/app/chroma_db
      - ~/campusiq-models:/root/.cache/huggingface
    env_file: .env
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
